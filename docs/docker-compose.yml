services:
  docker-link:
    image: lichangzhou/docker-link:latest
    container_name: docker-link
    restart: always
    ports:
      - "9080:9080"
    environment:
      TZ: "Asia/Shanghai"
      # 启用后全站 Basic 认证（强烈建议公网部署时开启）
      # ADMIN_USER: "admin"
      # ADMIN_PASSWORD: "change-me"
      # Compose 项目根目录（需与下方挂载一致）
      COMPOSE_DIR: "/opt/compose"
      # 文件管理可浏览的根，多个用 : 分隔
      # FS_ROOTS: "/data"
      # 镜像下载代理（内网地址务必加进 NO_PROXY）
      # HTTP_PROXY: "http://192.168.50.50:7890"
      # HTTPS_PROXY: "http://192.168.50.50:7890"
      # NO_PROXY: "localhost,127.0.0.1,::1,192.168.50.0/24"
    volumes:
      # Docker 引擎访问（必需）—— 持有面板访问权 ≈ 宿主 root 权限
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Compose 项目根目录（读写）
      - /opt/compose:/opt/compose:rw
      # 导航配置 / 图标 / 更新记录 / 设置
      - docker-link-data:/data
      # config.json
      - docker-link-config:/app/config

volumes:
  docker-link-data:
    name: docker-link-data
  docker-link-config:
    name: docker-link-config
